name: Should Run Checks
description: workflow入力と変更パスから、CIのチェックを実行すべきか判定します。
author: nimiusrd
branding:
  icon: filter
  color: blue
inputs:
  skip-extensions:
    description: スキップする拡張子（ドットから始め、1行に1つ指定）
    default: ''
  skip-directories:
    description: スキップするディレクトリ（リポジトリルートからの相対パスを1行に1つ指定）
    default: ''
  always-run-files:
    description: スキップ条件より優先してチェックを実行するファイル（相対パスを1行に1つ指定）
    default: ''
  config-path:
    description: 廃止済み。指定するとエラーになります。workflowのwithにルールを指定してください。
    deprecationMessage: config-pathは廃止しました。skip-extensions、skip-directories、always-run-filesへ移行してください。
outputs:
  run_checks:
    description: チェックを実行する場合はtrue、省略できる場合はfalse
  reason:
    description: 判定理由（changed-files、skip-only、no-changes、initial-push、unsupported-event、error）
runs:
  # JavaScript Actionの実行ランタイムはnode24まで。eMudhra対応にはランナー同梱の24.22.1以上が必要。
  # 開発とCIはNode.js 26.12.1を使う。
  using: node24
  main: dist/index.js
