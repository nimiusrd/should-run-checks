name: Release
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
permissions:
  actions: read
  contents: write
  pull-requests: read
jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Python 3.11以降を確認
        shell: bash
        run: python3 -c 'import sys; raise SystemExit(0 if sys.version_info >= (3, 11) else 1)'
      - name: リリースを作成
        shell: bash
        env:
          PYTHONUTF8: "1"
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
          RELEASE_EVENT: ${{ github.event.workflow_run.event }}
          RELEASE_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RELEASE_CI_RUN_ID: ${{ github.event.workflow_run.id }}
        run: python3 create_release.py
