name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - uses: ./
        id: scope
      - name: Verify action outputs
        env:
          RUN_CHECKS: ${{ steps.scope.outputs.run_checks }}
          REASON: ${{ steps.scope.outputs.reason }}
        run: |
          test "$RUN_CHECKS" = true || test "$RUN_CHECKS" = false
          test -n "$REASON"
