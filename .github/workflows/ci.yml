name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: 呼び出し元のPATHを保存
        if: matrix.python == '3.13'
        shell: bash
        run: printf '%s' "$PATH" > "$RUNNER_TEMP/caller-path"
      # 呼び出し元にPythonのセットアップやpip installを置かずに実行する。
      - uses: ./
        if: matrix.python == '3.13'
        id: scope
      - name: Actionの出力とPATHを検証
        if: matrix.python == '3.13'
        shell: bash
        env:
          RUN_CHECKS: ${{ steps.scope.outputs.run_checks }}
          REASON: ${{ steps.scope.outputs.reason }}
        run: |
          test "$RUN_CHECKS" = true || test "$RUN_CHECKS" = false
          test -n "$REASON"
          test "$PATH" = "$(cat "$RUNNER_TEMP/caller-path")"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONUTF8: '1'
      - run: python -m compileall -q should_run_checks.py tests
      - run: git diff --check
