name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: 呼び出し元のPATHを保存
        shell: bash
        run: printf '%s' "$PATH" > "$RUNNER_TEMP/caller-path"
      # 呼び出し元でNode.jsやnpm依存を準備せず、同梱JavaScriptを実行する。
      - uses: ./
        id: scope
      - name: Actionの出力とPATHを検証
        shell: bash
        env:
          RUN_CHECKS: ${{ steps.scope.outputs.run_checks }}
          REASON: ${{ steps.scope.outputs.reason }}
        run: |
          test "$RUN_CHECKS" = true || test "$RUN_CHECKS" = false
          test -n "$REASON"
          test "$PATH" = "$(cat "$RUNNER_TEMP/caller-path")"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: 配布JavaScriptとソースの一致を検証
        run: git diff --exit-code -- dist/index.js
      - run: npm test
      - run: npm run check
      - run: git diff --check
