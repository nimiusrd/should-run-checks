version = 1
name = "should-run-checks"

[setup]
script = '''
set -eu
devcontainer up --workspace-folder .
devcontainer exec --workspace-folder . npm ci
'''

[[actions]]
name = "コンテナ起動"
icon = "tool"
command = "devcontainer up --workspace-folder ."

[[actions]]
name = "テスト"
icon = "test"
command = "devcontainer exec --workspace-folder . npm test"

[[actions]]
name = "提出前チェック"
icon = "test"
command = '''
set -eu
devcontainer exec --workspace-folder . npm ci
devcontainer exec --workspace-folder . npm run build
devcontainer exec --workspace-folder . npm test
devcontainer exec --workspace-folder . npm run check
git diff --check
'''
